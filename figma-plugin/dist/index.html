<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fragmento Plugin</title>
  <style>
    :root {
      --figma-color-bg: #ffffff;
      --figma-color-bg-secondary: #f8f9fa;
      --figma-color-bg-hover: #f1f3f4;
      --figma-color-bg-brand: #18a0fb;
      --figma-color-text: #1e1e1e;
      --figma-color-text-secondary: #6c757d;
      --figma-color-border: #e1e5e9;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --figma-color-bg: #2c2c2c;
        --figma-color-bg-secondary: #3c3c3c;
        --figma-color-bg-hover: #4c4c4c;
        --figma-color-bg-brand: #18a0fb;
        --figma-color-text: #ffffff;
        --figma-color-text-secondary: #b3b3b3;
        --figma-color-border: #5c5c5c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      line-height: 16px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .fallback-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .fallback-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--figma-color-border);
      border-top: 2px solid var(--figma-color-bg-brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fallback-text {
      color: var(--figma-color-text-secondary);
      margin-bottom: 8px;
    }

    .fallback-error {
      color: #f24822;
      font-size: 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="fallback-ui">
      <div class="fallback-spinner"></div>
      <div class="fallback-text">Loading Fragmento...</div>
      <div class="fallback-error" id="fallback-error" style="display: none;">
        Plugin failed to load. Please try reloading.
      </div>
    </div>
  </div>

  <script>
    console.log('Fragmento plugin HTML loaded');
    
    // Show error after 10 seconds if JavaScript doesn't load
    let fallbackTimeout = setTimeout(() => {
      console.error('Plugin JavaScript failed to load');
      document.getElementById('fallback-error').style.display = 'block';
    }, 10000);

    // Clear timeout when JavaScript loads
    window.clearFallbackTimeout = () => {
      clearTimeout(fallbackTimeout);
    };

    // Inline JavaScript to avoid file loading issues
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, initializing inline JavaScript...');
      
      // Clear the fallback timeout
      if (window.clearFallbackTimeout) {
        window.clearFallbackTimeout();
      }
      
      const app = document.getElementById('app');
      if (app) {
        console.log('App container found, rendering UI...');
        app.innerHTML = `
          <div style="
            background: #1a1a1a; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-sizing: border-box;
          ">
            <div style="margin-bottom: 48px; text-align: center;">
              <div style="
                width: 80px; 
                height: 80px; 
                background: #333; 
                border-radius: 20px; 
                margin: 0 auto 24px; 
                display: flex; 
                align-items: center; 
                justify-content: center;
                border: 1px solid #444;
              ">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                </svg>
              </div>
              <h1 style="
                color: white; 
                font-size: 32px; 
                font-weight: 700; 
                margin: 0 0 8px 0;
                letter-spacing: -0.5px;
              ">Fragmento</h1>
              <p style="color: #888; font-size: 16px; margin: 0;">Design token management made simple</p>
            </div>
            
            <div style="width: 100%; max-width: 320px;">
              <button onclick="authenticateWithFragmento()" style="
                width: 100%; 
                padding: 16px 24px; 
                background: #007AFF; 
                color: white; 
                border: none; 
                border-radius: 12px; 
                cursor: pointer; 
                font-weight: 600; 
                font-size: 16px;
                margin-bottom: 12px;
                transition: all 0.2s ease;
                box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
              " onmouseover="this.style.background='#0056CC'; this.style.transform='translateY(-1px)'" onmouseout="this.style.background='#007AFF'; this.style.transform='translateY(0)'">
                Sign in with Fragmento
              </button>
              
              <button onclick="showSignUp()" style="
                width: 100%; 
                padding: 16px 24px; 
                background: transparent; 
                color: #888; 
                border: 1px solid #333; 
                border-radius: 12px; 
                cursor: pointer; 
                font-weight: 500; 
                font-size: 16px;
                transition: all 0.2s ease;
              " onmouseover="this.style.borderColor='#555'; this.style.color='#aaa'" onmouseout="this.style.borderColor='#333'; this.style.color='#888'">
                Sign up
              </button>
            </div>
            
            <p style="color: #666; font-size: 12px; line-height: 1.4; text-align: center; margin-top: 32px; max-width: 280px;">
              Connect your Figma variables to your design system with seamless token management.
            </p>
            
            <div id="output" style="margin-top: 24px; padding: 12px; background: #333; border-radius: 8px; text-align: left; font-size: 12px; min-height: 60px; display: none; color: #ccc; width: 100%; max-width: 320px;"></div>
          </div>
        `;
        console.log('UI rendered successfully');
      } else {
        console.error('App container not found');
      }
    });

    function showSignUp() {
      // Open sign-up page in browser
      if (parent && parent.postMessage) {
        parent.postMessage({ 
          pluginMessage: { 
            type: 'open-url',
            payload: { url: 'https://fragmento-theta.vercel.app/signup' }
          } 
        }, '*');
      }
    }

    function signOut() {
      // Clear authentication and return to sign-in
      if (parent && parent.postMessage) {
        parent.postMessage({ 
          pluginMessage: { 
            type: 'logout'
          } 
        }, '*');
      }
    }

    function showProjectSelector() {
      // Navigate back to project selection
      if (parent && parent.postMessage) {
        parent.postMessage({ 
          pluginMessage: { 
            type: 'show-project-selector'
          } 
        }, '*');
      }
    }

    function pushVariables() {
      // Trigger push variables if any are available
      const pushButton = document.getElementById('pushButton');
      if (pushButton && !pushButton.disabled) {
        confirmImport();
      }
    }

    function showUserMenu() {
      // Could show user menu in future
      console.log('User menu clicked');
    }

    function authenticateWithFragmento() {
      console.log('Authenticate with Fragmento clicked');
      const output = document.getElementById('output');
      if (output) {
        output.style.display = 'block';
        output.innerHTML = 'Opening browser for authentication...';
      }
      
      try {
        if (parent && parent.postMessage) {
          parent.postMessage({ pluginMessage: { type: 'authenticate' } }, '*');
          console.log('Authentication message sent to plugin');
        } else {
          if (output) {
            output.innerHTML = '❌ Error: Cannot communicate with plugin';
          }
        }
      } catch (error) {
        console.error('Error sending authentication message:', error);
        if (output) {
          output.innerHTML = '❌ Error: ' + error.message;
        }
      }
    }

    function showOrganizationSelector(organizations, userInfo) {
      const app = document.getElementById('app');
      if (!app) return;
      
      app.innerHTML = `
        <div style="
          background: #1a1a1a; 
          color: white; 
          height: 100vh; 
          padding: 20px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
        ">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
            <h1 style="color: white; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.5px;">Fragmento</h1>
            <button onclick="signOut()" style="
              background: none; 
              border: none; 
              cursor: pointer; 
              color: #888;
              padding: 8px;
              border-radius: 6px;
              transition: color 0.2s;
            " onmouseover="this.style.color='#ccc'" onmouseout="this.style.color='#888'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="16,17 21,12 16,7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          
          <div style="flex: 1;">
            <div style="margin-bottom: 32px;">
              <h2 style="color: white; font-size: 20px; font-weight: 600; margin: 0 0 8px 0;">Choose a project</h2>
              <p style="color: #888; font-size: 14px; margin: 0;">Select your organization and project to get started</p>
            </div>
            
            <div style="margin-bottom: 20px;">
              <label style="display: block; color: #ccc; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Organization</label>
              <select id="organizationSelect" onchange="onOrganizationChange()" style="
                width: 100%; 
                padding: 12px 16px; 
                border: 1px solid #333; 
                border-radius: 8px; 
                font-size: 14px; 
                background: #2a2a2a;
                color: white;
                cursor: pointer;
              ">
                <option value="">Select organization...</option>
                ${organizations.map(org => `<option value="${org.id}">${org.name}</option>`).join('')}
              </select>
            </div>
            
            <div style="margin-bottom: 32px;">
              <label style="display: block; color: #ccc; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Project</label>
              <select id="projectSelect" onchange="onProjectChange()" disabled style="
                width: 100%; 
                padding: 12px 16px; 
                border: 1px solid #333; 
                border-radius: 8px; 
                font-size: 14px; 
                background: #2a2a2a;
                color: #666;
                cursor: not-allowed;
              ">
                <option value="">Select organization first...</option>
              </select>
            </div>
            
            <button id="loadProjectBtn" onclick="loadProject()" disabled style="
              width: 100%; 
              padding: 16px 24px; 
              background: #333; 
              color: #666; 
              border: none; 
              border-radius: 12px; 
              cursor: not-allowed; 
              font-weight: 600; 
              font-size: 16px;
              transition: all 0.2s ease;
            ">
              Load Project
            </button>
          </div>
          
          <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #333;">
            <div style="
              width: 32px; 
              height: 32px; 
              background: #007AFF; 
              border-radius: 50%; 
              display: flex; 
              align-items: center; 
              justify-content: center;
              color: white;
              font-weight: 600;
              font-size: 14px;
            ">
              ${userInfo?.email ? userInfo.email.charAt(0).toUpperCase() : 'U'}
            </div>
            <span style="color: #888; font-size: 12px; margin-left: 8px;">${userInfo?.email || 'User'}</span>
          </div>
          
          <div id="output" style="margin-top: 16px; padding: 12px; background: #333; border-radius: 8px; text-align: left; font-size: 12px; display: none; color: #ccc;"></div>
        </div>
      `;
    }

    async function handleTokenPolling(state, attempt) {
      try {
        console.log('UI polling attempt', attempt, 'for state:', state);
        console.log('Making request to: https://fragmento-theta.vercel.app/api/figma/poll-token?state=' + state);
        
        const response = await fetch('https://fragmento-theta.vercel.app/api/figma/poll-token?state=' + state);
        console.log('Polling response:', response.status, response.statusText);
        
        const output = document.getElementById('output');
        
        if (response.ok) {
          const tokenData = await response.json();
          console.log('Token found via UI polling!', { hasToken: !!tokenData.token, userId: tokenData.userId?.substring(0, 8) + '...' });
          
          if (output) {
            output.innerHTML = '✅ Token found! Sending to plugin...';
          }
          
          // Send token back to plugin
          if (parent && parent.postMessage) {
            parent.postMessage({
              pluginMessage: {
                type: 'token-found',
                payload: {
                  token: tokenData.token,
                  userId: tokenData.userId,
                  expiresIn: tokenData.expiresIn
                }
              }
            }, '*');
          }
        } else if (response.status === 404) {
          console.log('Token not ready (404), continuing to poll...');
          if (output) {
            output.innerHTML = '⏳ Token not ready yet (404). Try again in a few seconds.';
          }
        } else {
          console.error('Token polling failed with status:', response.status);
          const errorText = await response.text();
          console.error('Error response:', errorText);
          if (output) {
            output.innerHTML = '❌ Polling failed: ' + response.status + ' - ' + errorText;
          }
        }
      } catch (error) {
        console.error('UI token polling error:', error);
        const output = document.getElementById('output');
        if (output) {
          output.innerHTML = '❌ Network error: ' + error.message;
        }
      }
    }

    // Listen for messages from plugin
    window.addEventListener('message', function(event) {
      if (event.data && event.data.pluginMessage) {
        const msg = event.data.pluginMessage;
        console.log('UI received message from plugin:', msg.type);
        
        const output = document.getElementById('output');
        
        if (msg.type === 'pong') {
          if (output) {
            output.innerHTML = '✅ Plugin connection successful!<br>📩 Received: ' + msg.payload.message;
          }
        } else if (msg.type === 'auth-initiated') {
          if (output) {
            output.innerHTML += '<br>🌐 Browser opened for authentication';
          }
        } else if (msg.type === 'auth-success') {
          console.log('Authentication successful, waiting for organizations...');
          const output = document.getElementById('output');
          if (output) {
            output.style.display = 'block';
            output.innerHTML = 'Authentication successful! Loading organizations...';
          }
        } else if (msg.type === 'auth-error') {
          const output = document.getElementById('output');
          if (output) {
            output.style.display = 'block';
            output.innerHTML = '❌ Authentication failed: ' + msg.payload.message;
          }
        } else if (msg.type === 'poll-token') {
          // Handle automatic token polling from plugin
          console.log('Received poll-token request from plugin:', msg.payload);
          handleTokenPolling(msg.payload.state, msg.payload.attempt);
        } else if (msg.type === 'organizations-loaded') {
          // Show organization selector interface
          console.log('Organizations loaded:', msg.payload.organizations);
          showOrganizationSelector(msg.payload.organizations, msg.payload.userInfo);
        } else if (msg.type === 'projects-loaded') {
          // Handle projects data from plugin
          console.log('Projects loaded:', msg.payload.projects);
          projects = msg.payload.projects;
          
          const projectSelect = document.getElementById('projectSelect');
          if (projectSelect) {
            projectSelect.innerHTML = '<option value="">Select project...</option>';
            projects.forEach(project => {
              projectSelect.innerHTML += `<option value="${project.id}">${project.name}</option>`;
            });
          }
        } else if (msg.type === 'project-loaded') {
          // Show main interface after project is loaded
          console.log('Project loaded successfully');
          showMainInterface(msg.payload.project);
        } else if (msg.type === 'variables-scanned') {
          // Show variables after scanning
          console.log('Variables scanned:', msg.payload);
          showVariablesInterface(msg.payload.collections, msg.payload.totalCount, msg.payload.changeAnalysis, msg.payload.isFirstScan);
        } else if (msg.type === 'push-progress') {
          // Handle push progress updates
          console.log('Push progress:', msg.payload);
          updatePushProgress(msg.payload.stage, msg.payload.message);
        } else if (msg.type === 'push-success') {
          // Handle successful push
          console.log('Push successful:', msg.payload);
          showPushSuccess(msg.payload);
        } else if (msg.type === 'push-error') {
          // Handle push error
          console.log('Push error:', msg.payload);
          showPushError(msg.payload.message);
        }
      }
    });

    // Organization and Project selector functions
    let selectedOrganization = null;
    let selectedProject = null;
    let projects = [];

    function onOrganizationChange() {
      const select = document.getElementById('organizationSelect');
      const projectSelect = document.getElementById('projectSelect');
      const loadBtn = document.getElementById('loadProjectBtn');
      
      if (select.value) {
        selectedOrganization = select.value;
        
        // Enable project dropdown and fetch projects
        projectSelect.disabled = false;
        projectSelect.style.background = 'white';
        projectSelect.style.cursor = 'pointer';
        projectSelect.innerHTML = '<option value="">Loading projects...</option>';
        
        // Request projects from plugin
        if (parent && parent.postMessage) {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'fetch-projects', 
              payload: { organizationId: selectedOrganization } 
            } 
          }, '*');
        }
      } else {
        selectedOrganization = null;
        projectSelect.disabled = true;
        projectSelect.style.background = '#2a2a2a';
        projectSelect.style.cursor = 'not-allowed';
        projectSelect.innerHTML = '<option value="">Select organization first...</option>';
        
        loadBtn.disabled = true;
        loadBtn.style.background = '#333';
        loadBtn.style.color = '#666';
        loadBtn.style.cursor = 'not-allowed';
      }
    }

    function onProjectChange() {
      const select = document.getElementById('projectSelect');
      const loadBtn = document.getElementById('loadProjectBtn');
      const projectInfo = document.getElementById('projectInfo');
      const projectDetails = document.getElementById('projectDetails');
      
      if (select.value) {
        selectedProject = select.value;
        const project = projects.find(p => p.id === selectedProject);
        
        if (project) {
          // Show project info
          projectInfo.style.display = 'block';
          projectInfo.innerHTML = `(${project.access_level || 'Can Edit'})`;
          
          // Show project details
          projectDetails.style.display = 'block';
          document.getElementById('projectDescription').innerHTML = project.description || 'No description available';
          document.getElementById('projectStats').innerHTML = `
            • ${project.token_count || 0} tokens across ${project.token_sets || 0} sets<br>
            • Last release: ${project.latest_version || 'None'}<br>
            • ${project.pending_changes || 0} pending changes
          `;
        }
        
        // Enable load button
        loadBtn.disabled = false;
        loadBtn.style.background = '#007AFF';
        loadBtn.style.color = 'white';
        loadBtn.style.cursor = 'pointer';
      } else {
        selectedProject = null;
        projectInfo.style.display = 'none';
        projectDetails.style.display = 'none';
        
        loadBtn.disabled = true;
        loadBtn.style.background = '#333';
        loadBtn.style.color = '#666';
        loadBtn.style.cursor = 'not-allowed';
      }
    }

    function loadProject() {
      console.log('Load Project clicked', { selectedOrganization, selectedProject });
      
      if (selectedOrganization && selectedProject) {
        const output = document.getElementById('output');
        if (output) {
          output.style.display = 'block';
          output.innerHTML = 'Loading project...';
        }
        
        console.log('Sending load-project message to plugin');
        
        // Send selection to plugin
        if (parent && parent.postMessage) {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'load-project', 
              payload: { 
                organizationId: selectedOrganization,
                projectId: selectedProject
              } 
            } 
          }, '*');
          console.log('Message sent successfully');
        } else {
          console.error('parent.postMessage not available');
          if (output) {
            output.innerHTML = '❌ Error: Cannot communicate with plugin';
          }
        }
      } else {
        console.error('Missing selection:', { selectedOrganization, selectedProject });
        const output = document.getElementById('output');
        if (output) {
          output.style.display = 'block';
          output.innerHTML = '❌ Please select both organization and project';
        }
      }
    }

    function showMainInterface(project) {
      const app = document.getElementById('app');
      if (!app) return;
      
      app.innerHTML = `
        <div style="
          background: #1a1a1a; 
          color: white; 
          height: 100vh; 
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
        ">
          <div style="
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 20px; 
            border-bottom: 1px solid #333;
            background: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
          ">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button onclick="showProjectSelector()" style="
                background: none; 
                border: none; 
                cursor: pointer; 
                color: #888;
                padding: 6px;
                border-radius: 4px;
                transition: color 0.2s;
              " onmouseover="this.style.color='#ccc'" onmouseout="this.style.color='#888'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <div>
                <h1 style="color: white; font-size: 16px; font-weight: 600; margin: 0;">${project.name}</h1>
                <p style="color: #888; font-size: 12px; margin: 0;">Fragmento</p>
              </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
              <button onclick="importFigmaVariables()" style="
                background: none; 
                border: none; 
                cursor: pointer; 
                color: #888;
                padding: 8px;
                border-radius: 6px;
                transition: all 0.2s;
              " onmouseover="this.style.color='#ccc'; this.style.background='#333'" onmouseout="this.style.color='#888'; this.style.background='none'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              
              <button onclick="pushVariables()" style="
                background: none; 
                border: none; 
                cursor: pointer; 
                color: #888;
                padding: 8px;
                border-radius: 6px;
                transition: all 0.2s;

    function showVariablesInterface(collections, totalCount, changeAnalysis, isFirstScan) {
      const mainContent = document.getElementById('mainContent');
      if (!mainContent) return;
      
      mainContent.innerHTML = `
        <div style="padding: 20px; color: white;">
          ${!isFirstScan && changeAnalysis && (changeAnalysis.summary.totalAdded + changeAnalysis.summary.totalModified + changeAnalysis.summary.totalDeleted > 0) ? `

            ${collections.map(collection => renderCollection(collection)).join('')}

            <button id="pushButton" onclick="confirmImport()" style="
              width: 100%; 
              padding: 16px 24px; 
              background: #007AFF; 
              color: white; 
              border: none; 
              border-radius: 12px; 
              cursor: pointer; 
              font-weight: 600; 
              font-size: 16px;
              transition: all 0.2s ease;
              box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
            " onmouseover="this.style.background='#0056CC'; this.style.transform='translateY(-1px)'" onmouseout="this.style.background='#007AFF'; this.style.transform='translateY(0)'">
              Push to Fragmento
            </button>
          </div>
        </div>
      `;
      
      // Store change analysis globally for filtering
      window.currentChangeAnalysis = changeAnalysis;
      window.currentCollections = collections;
      window.currentTotalCount = totalCount;
      window.currentIsFirstScan = isFirstScan;
      
      // Update push button after rendering
      setTimeout(() => updatePushButton(), 100);

    function showOnlyChanges() {
      if (!window.currentChangeAnalysis) return;
      
      const changeAnalysis = window.currentChangeAnalysis;
      const filteredCollections = [];
      
      // Create collections with only changed variables
      window.currentCollections.forEach(collection => {
        const changedVariables = collection.variables.filter(variable => {
          const variableKey = `${collection.id}:${variable.id}`;
          return changeAnalysis.added.some(v => `${v.collectionId}:${v.id}` === variableKey) ||
                 changeAnalysis.modified.some(v => `${v.collectionId}:${v.id}` === variableKey);
        });
        
        if (changedVariables.length > 0) {
          filteredCollections.push({
            ...collection,
            variables: changedVariables
          });
        }
      });
      
      const totalChanges = changeAnalysis.summary.totalAdded + changeAnalysis.summary.totalModified;
      showVariablesInterface(filteredCollections, totalChanges, changeAnalysis, window.currentIsFirstScan);
    }

    function showAllVariables() {
      if (!window.currentCollections) return;
      showVariablesInterface(window.currentCollections, window.currentTotalCount, window.currentChangeAnalysis, window.currentIsFirstScan);
    }

    function renderCollection(collection) {
      return `
        <div style="margin-bottom: 16px; border: 1px solid #444; border-radius: 8px; overflow: hidden; background: #2a2a2a;">
          <div style="background: #333; padding: 12px 16px; border-bottom: 1px solid #444;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <h3 style="color: white; font-size: 14px; font-weight: 600; margin: 0; font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;">
                ${collection.name}
              </h3>
              <label style="display: flex; align-items: center; font-size: 12px; color: #888; cursor: pointer;">
                <input type="checkbox" onchange="toggleCollection('${collection.id}')" checked style="margin-right: 6px; accent-color: #007AFF;">
                Select All (${collection.variables.length})
              </label>
            </div>
          </div>
          
          <div style="background: #2a2a2a;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #444; background: #333;">
              <div style="padding: 8px 16px; font-size: 12px; font-weight: 500; color: #888; border-right: 1px solid #444;">Token Name</div>
              <div style="padding: 8px 16px; font-size: 12px; font-weight: 500; color: #888;">Value</div>
            </div>
            
            <div style="max-height: 160px; overflow-y: auto;">
              ${collection.variables.map((variable, index) => renderVariable(variable, collection.id, index)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderVariable(variable, collectionId, index) {
      const bgColor = index % 2 === 0 ? '#2a2a2a' : '#333';
      const warningIcon = variable.hasWarning ? '⚠️' : '';
      const typeColor = getTypeColor(variable.tokenType);
      
      // Check if this variable has changes
      let changeIndicator = '';
      let changeBgColor = bgColor;
      
      if (window.currentChangeAnalysis) {
        const variableKey = `${collectionId}:${variable.id}`;
        const isAdded = window.currentChangeAnalysis.added.some(v => `${v.collectionId}:${v.id}` === variableKey);
        const isModified = window.currentChangeAnalysis.modified.some(v => `${v.collectionId}:${v.id}` === variableKey);
        
        if (isAdded) {
          changeIndicator = '<span style="background: #16a34a; color: white; font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-left: 6px;">NEW</span>';
          changeBgColor = index % 2 === 0 ? '#1a3a1a' : '#2a4a2a';
        } else if (isModified) {
          changeIndicator = '<span style="background: #d97706; color: white; font-size: 9px; padding: 2px 4px; border-radius: 3px; margin-left: 6px;">MOD</span>';
          changeBgColor = index % 2 === 0 ? '#3a2a1a' : '#4a3a2a';
        }
      }
      
      return `
        <div style="display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #444; background: ${changeBgColor};">
          <div style="padding: 12px 16px; border-right: 1px solid #444; display: flex; align-items: center;">
            <input type="checkbox" class="variable-checkbox" data-collection="${collectionId}" data-variable="${variable.id}" checked onchange="updatePushButton()" style="margin-right: 8px; accent-color: #007AFF;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 12px; color: white;">
                  ${variable.name}
                </span>
                ${warningIcon}
                ${changeIndicator}
              </div>
              <div style="display: flex; align-items: center; gap: 4px; margin-top: 2px;">
                <span style="background: ${typeColor}; color: white; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 500;">
                  ${variable.tokenType}
                </span>
                <span style="color: #888; font-size: 10px;">
                  ${variable.resolvedType}
                </span>
              </div>
              ${variable.hasWarning ? `<div style="color: #f59e0b; font-size: 10px; margin-top: 2px;">${variable.warningMessage}</div>` : ''}
            </div>
          </div>
          <div style="padding: 12px 16px; display: flex; align-items: center;">
            <span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 11px; color: #ccc; word-break: break-all;">
              ${variable.value}
            </span>
          </div>
        </div>
      `;
    }

    function renderVariableValue(variable) {
      if (variable.resolvedType === 'COLOR') {
        if (variable.isAlias) {
          return `<span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 12px; color: #7c3aed;">{${variable.aliasName}}</span>`;
        } else {
          return `
            <div style="display: flex; align-items: center;">
              <div style="width: 16px; height: 16px; border-radius: 50%; background: ${variable.value}; border: 1px solid #e5e5e5; margin-right: 8px;"></div>
              <span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 12px; color: #374151;">
                ${variable.value}
              </span>
            </div>
          `;
        }
      } else {
        if (variable.isAlias) {
          return `<span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 12px; color: #7c3aed;">{${variable.aliasName}}</span>`;
        } else {
          return `<span style="font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace; font-size: 12px; color: #374151;">${variable.value}</span>`;
        }
      }
    }

    function toggleAllVariables() {
      const selectAll = document.getElementById('selectAllVariables');
      const checkboxes = document.querySelectorAll('.variable-checkbox');
      
      checkboxes.forEach(checkbox => {
        checkbox.checked = selectAll.checked;
      });
      
      updatePushButton();
    }

    function updatePushButton() {
      const selectedCount = document.querySelectorAll('.variable-checkbox:checked').length;
      const pushButton = document.getElementById('pushButton');
      
      if (pushButton) {
        if (selectedCount === 0) {
          pushButton.textContent = '🚀 Push to Fragmento';
          pushButton.style.opacity = '0.5';
          pushButton.style.cursor = 'not-allowed';
          pushButton.disabled = true;
        } else {
          pushButton.textContent = `🚀 Push ${selectedCount} Variable${selectedCount === 1 ? '' : 's'} to Fragmento`;
          pushButton.style.opacity = '1';
          pushButton.style.cursor = 'pointer';
          pushButton.disabled = false;
        }
      }
    }

    function toggleCollection(collectionId) {
      const collectionCheckboxes = document.querySelectorAll(`[data-collection="${collectionId}"]`);
      const collectionToggle = event.target;
      
      collectionCheckboxes.forEach(checkbox => {
        checkbox.checked = collectionToggle.checked;
      });
      
      updatePushButton();
    }

    function getTypeColor(tokenType) {
      const colors = {
        'color': '#ef4444',
        'spacing': '#3b82f6',
        'number': '#8b5cf6',
        'string': '#10b981',
        'fontFamily': '#f59e0b',
        'unknown': '#6b7280'
      };
      return colors[tokenType] || colors.unknown;
    }

    function confirmImport() {
      const selectedVariables = [];
      const checkboxes = document.querySelectorAll('.variable-checkbox:checked');
      
      checkboxes.forEach(checkbox => {
        selectedVariables.push({
          collectionId: checkbox.dataset.collection,
          variableId: checkbox.dataset.variable
        });
      });
      
      console.log('Push to Fragmento:', selectedVariables.length);
      
      // Show push confirmation dialog
      showPushConfirmationDialog(selectedVariables);
    }

      overlay.style.cssText = `
        position: fixed;

        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      `;
      
      // Count variables by type and collection
      const stats = analyzeSelectedVariables(selectedVariables);
      
      overlay.innerHTML = `
        <div style="
          background: white;
          border-radius: 12px;
          padding: 24px;
          max-width: 400px;
          width: 100%;

            Confirm Push to Fragmento

          <p style="color: #666; font-size: 14px; margin: 0 0 20px 0; line-height: 1.5;">
            This will sync ${selectedVariables.length} variables from Figma to your Fragmento project.
          </p>
          
          <div style="background: #f0f9ff; border: 1px solid #0ea5e9; border-radius: 6px; padding: 12px; margin-bottom: 20px;">
            <div style="color: #0369a1; font-size: 12px; font-weight: 500; margin-bottom: 4px;">ℹ️ Token Name Conversion</div>
            <div style="color: #0369a1; font-size: 11px; line-height: 1.4;">
              Figma variable names will be automatically converted to valid token names:<br>
              • Forward slashes (/) → dots (.)<br>
              • Spaces → underscores (_)<br>
              • Example: "surface/surface-primary" → "surface.surface-primary"
            </div>
          </div>
          
          <div style="background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 20px;">

            <div style="font-size: 13px; color: #374151; line-height: 1.6;">
              <div>• <strong>${stats.newTokens}</strong> new tokens will be created</div>

            </div>
          </div>
          
          ${stats.warnings > 0 ? `
            <div style="background: #fef3c7; border: 1px solid #f59e0b; border-radius: 6px; padding: 12px; margin-bottom: 20px;">
              <div style="color: #92400e; font-size: 12px; font-weight: 500;">⚠️ Warnings:</div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button onclick="closePushDialog()" style="
              flex: 1;
              padding: 12px 16px;

              flex: 1;

              color: white;
              border: none;
              border-radius: 6px;
              cursor: pointer;
              font-weight: 500;
              font-size: 14px;
            ">
              Confirm Push
            </button>
          </div>

      document.body.appendChild(overlay);

    function analyzeSelectedVariables(selectedVariables) {
      // This would normally analyze against existing Fragmento data
      // For now, return mock analysis
      const collections = [...new Set(selectedVariables.map(v => v.collectionId))];
      
      return {
        newTokens: selectedVariables.length,
        updatedTokens: 0,
        newSets: collections.length,
        collections: collections,
        warnings: selectedVariables.filter(v => {
          // Check if variable has warnings (would need to access variable data)
          return false; // Placeholder
        }).length
      };
    }

    function closePushDialog() {
      if (window.currentPushOverlay) {
        document.body.removeChild(window.currentPushOverlay);
        window.currentPushOverlay = null;
      }
    }

    function executePush(selectedVariables) {
      closePushDialog();
      
      console.log('Executing push:', selectedVariables.length);
      
      // Send push request to plugin
      if (parent && parent.postMessage) {
        parent.postMessage({ 
          pluginMessage: { 
            type: 'push-variables',
            payload: { selectedVariables }
          } 
        }, '*');
      }
      
      // Show initial loading state
      const mainContent = document.getElementById('mainContent');
      if (mainContent) {
        mainContent.innerHTML = `
          <div id="pushProgress" style="text-align: center; padding: 40px 20px;">
            <div style="font-size: 32px; margin-bottom: 16px;">📤</div>
            <h2 id="pushTitle" style="color: #1a1a1a; font-size: 16px; font-weight: 500; margin: 0 0 8px 0;">Preparing to push...</h2>
            <p id="pushMessage" style="color: #666; font-size: 13px; margin: 0 0 16px 0;">Initializing sync of ${selectedVariables.length} variables</p>
            <div style="width: 100%; max-width: 300px; margin: 0 auto; background: #f3f4f6; border-radius: 8px; overflow: hidden;">
              <div id="progressBar" style="height: 4px; background: #18a0fb; width: 10%; transition: width 0.3s ease;"></div>
            </div>
          </div>
        `;
      }
    }

    function updatePushProgress(stage, message) {
      const pushTitle = document.getElementById('pushTitle');
      const pushMessage = document.getElementById('pushMessage');
      const progressBar = document.getElementById('progressBar');
      
      if (pushTitle) pushTitle.textContent = getStageTitle(stage);
      if (pushMessage) pushMessage.textContent = message;
      if (progressBar) {
        const progress = getStageProgress(stage);
        progressBar.style.width = progress + '%';
      }
    }

    function getStageTitle(stage) {
      switch (stage) {
        case 'pushing': return 'Pushing to Fragmento...';
        case 'processing': return 'Processing Variables...';
        case 'completing': return 'Finalizing Changes...';
        default: return 'Processing...';
      }
    }

    function getStageProgress(stage) {
      switch (stage) {
        case 'pushing': return 30;
        case 'processing': return 70;
        case 'completing': return 90;
        default: return 10;
      }
    }

    function showPushSuccess(payload) {
      const mainContent = document.getElementById('mainContent');
      if (!mainContent) return;
      
      const { summary, results, projectUrl } = payload;
      const hasErrors = results.errors && results.errors.length > 0;
      
      mainContent.innerHTML = `
        <div style="text-align: center; padding: 40px 20px;">
          <div style="font-size: 48px; margin-bottom: 24px;">${hasErrors ? '⚠️' : '🎉'}</div>
          
          <h2 style="color: #1a1a1a; font-size: 18px; font-weight: 600; margin: 0 0 12px 0;">
            ${hasErrors ? 'Push Completed with Warnings' : 'Successfully Pushed to Fragmento!'}
          </h2>
          
          <div style="background: #f8f9fa; border-radius: 8px; padding: 20px; margin: 24px 0; text-align: left;">
            <h3 style="color: #1a1a1a; font-size: 14px; font-weight: 600; margin: 0 0 12px 0;">Summary</h3>
            <div style="font-size: 13px; color: #374151; line-height: 1.6;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span>Tokens Created:</span>
                <strong style="color: #10b981;">${summary.tokensCreated}</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span>Tokens Updated:</span>
                <strong style="color: #3b82f6;">${summary.tokensUpdated}</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                <span>Sets Created:</span>
                <strong style="color: #8b5cf6;">${summary.setsCreated}</strong>
              </div>
              ${hasErrors ? `
                <div style="display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e5e5;">
                  <span>Errors:</span>
                  <strong style="color: #ef4444;">${summary.errors.length}</strong>
                </div>
              ` : ''}
            </div>
          </div>
          
          ${hasErrors ? `
            <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 12px; margin-bottom: 20px; text-align: left;">
              <div style="color: #dc2626; font-size: 12px; font-weight: 500; margin-bottom: 8px;">⚠️ Errors encountered:</div>
              <div style="max-height: 120px; overflow-y: auto;">
                ${summary.errors.map(error => `
                  <div style="color: #dc2626; font-size: 11px; margin-bottom: 4px; padding: 4px 8px; background: white; border-radius: 4px;">
                    ${error}
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
          
          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button onclick="importFigmaVariables()" style="
              flex: 1;
              padding: 12px 16px;
              background: #f3f4f6;
              color: #374151;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              cursor: pointer;
              font-weight: 500;
              font-size: 14px;
            ">
              Import More Variables
            </button>
            <button onclick="openInFragmento('${projectUrl}')" style="
              flex: 1;
              padding: 12px 16px;
              background: #18a0fb;
              color: white;
              border: none;
              border-radius: 6px;
              cursor: pointer;
              font-weight: 500;
              font-size: 14px;
            ">
              View in Fragmento
            </button>
          </div>
        </div>
      `;
    }

    function showPushError(errorMessage) {
      const mainContent = document.getElementById('mainContent');
      if (!mainContent) return;
      
      mainContent.innerHTML = `
        <div style="text-align: center; padding: 40px 20px;">
          <div style="font-size: 48px; margin-bottom: 24px;">❌</div>
          
          <h2 style="color: #1a1a1a; font-size: 18px; font-weight: 600; margin: 0 0 12px 0;">
            Push Failed
          </h2>
          
          <p style="color: #666; font-size: 14px; line-height: 1.5; margin: 0 0 24px 0;">
            There was an error pushing your variables to Fragmento.
          </p>
          
          <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 16px; margin-bottom: 24px; text-align: left;">
            <div style="color: #dc2626; font-size: 12px; font-weight: 500; margin-bottom: 8px;">Error Details:</div>
            <div style="color: #dc2626; font-size: 12px; font-family: 'SF Mono', Monaco, monospace;">
              ${errorMessage}
            </div>
          </div>
          
          <div style="display: flex; gap: 12px;">
            <button onclick="importFigmaVariables()" style="
              flex: 1;
              padding: 12px 16px;
              background: #f3f4f6;
              color: #374151;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              cursor: pointer;
              font-weight: 500;
              font-size: 14px;
            ">
              Back to Variables
            </button>
            <button onclick="confirmImport()" style="
              flex: 1;
              padding: 12px 16px;
              background: #18a0fb;
              color: white;
              border: none;
              border-radius: 6px;
              cursor: pointer;
              font-weight: 500;
              font-size: 14px;
            ">
              Try Again
            </button>
          </div>
        </div>
      `;
    }

    function openInFragmento(url) {
      if (url) {
        // Send message to plugin to open URL
        if (parent && parent.postMessage) {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'open-url', 
              payload: { url } 
            } 
          }, '*');
        }
      }
    }

    function showSettings() {
      // TODO: Implement settings modal
      console.log('Settings clicked');
    }

    console.log('Inline JavaScript setup complete');
  </script>
</body>
</html>
